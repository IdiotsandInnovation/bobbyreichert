<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Am I Alive?</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --text-muted: #888888;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            overflow-x: hidden;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: clamp(1.5rem, 5vw, 3.5rem);
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: var(--text-sub);
            letter-spacing: -0.02em;
        }

        #status {
            font-size: clamp(1.25rem, 3.5vw, 2.25rem);
            font-weight: 700;
            margin: 1.25rem 0;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            display: inline-block;
            word-break: break-word;
            max-width: 100%;
            line-height: 1.3;
        }

        #details {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--text-muted);
            margin-top: 0.5rem;
            word-break: break-word;
        }
        
        /* Status Colors */
        .green { background-color: #e6f4ea; color: #137333; }
        .yellow { background-color: #fef7e0; color: #b06000; }
        .vacation { background-color: #e8f0fe; color: #1967d2; }
        .orange { background-color: #fce8e6; color: #c5221f; }
        .gray { background-color: #f1f3f4; color: #5f6368; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Am I Alive?</h1>
        <div id="status" class="gray">Checking...</div>
        <div id="details">Connecting to database...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCJTduHsoftZ9jxzK2zGt89JKXhLhkeGk8",
          authDomain: "bobbyreichertwebpage.firebaseapp.com",
          projectId: "bobbyreichertwebpage",
          storageBucket: "bobbyreichertwebpage.firebasestorage.app",
          messagingSenderId: "621093540176",
          appId: "1:621093540176:web:56cdb61804298e570c1c55",
          measurementId: "G-GJ4RV7NNXH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function checkStatus() {
            const statusEl = document.getElementById('status');
            const detailsEl = document.getElementById('details');

            try {
                // Query the collection, sorting by 'createdAt' descending to get the most recent entry
                const q = query(collection(db, "lyric_of_the_day"), orderBy("createdAt", "desc"), limit(1));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    statusEl.textContent = "Unknown";
                    statusEl.className = "gray";
                    detailsEl.textContent = "No records found in lyric_of_the_day.";
                    return;
                }

                const docData = querySnapshot.docs[0].data();
                const createdAt = docData.createdAt;

                // Handle different Firebase Timestamp formats (Firestore Timestamp object vs Date vs Milliseconds/Seconds)
                let date;
                if (createdAt && typeof createdAt.toDate === 'function') {
                    date = createdAt.toDate(); // Firestore Timestamp
                } else {
                    date = new Date(createdAt); // Regular timestamp string or number
                }

                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = diffTime / (1000 * 60 * 60 * 24); // Convert ms to days

                // Determine status based on your rules
                if (diffDays < 3) {
                    statusEl.textContent = "Definitely Alive";
                    statusEl.className = "green";
                } else if (diffDays >= 3 && diffDays <= 10) {
                    statusEl.textContent = "Most Likely Alive";
                    statusEl.className = "yellow";
                } else if (diffDays > 10 && diffDays < 20) {
                    statusEl.textContent = "Probably alive & on vacation/break";
                    statusEl.className = "vacation";
                } else {
                    statusEl.textContent = "Potentially alive, check if this service is deprecated. No updates in a while.";
                    statusEl.className = "orange";
                }

                detailsEl.textContent = `Last update: ${date.toLocaleString()} (${diffDays.toFixed(1)} days ago)`;

            } catch (error) {
                console.error("Error fetching data: ", error);
                statusEl.textContent = "Error";
                statusEl.className = "orange";
                detailsEl.textContent = "Failed to fetch from Firebase. Check console.";
            }
        }

        checkStatus();
    </script>
</body>
</html>
