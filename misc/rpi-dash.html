<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Display Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        'primary': '#4f46e5',
                        'primary-light': '#818cf8',
                        'surface': '#f8fafc',
                        'card': '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f1f5f9;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
        }

        /* Horizontal Scroll Snap Container */
        #carousel-track {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
        }

        #carousel-track::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Individual Full-Viewport Slide */
        .slide {
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.25rem;
            overflow: hidden;
        }

        /* Subtle ambient radial glow for light theme */
        .ambient-bg {
            background: radial-gradient(circle at 50% 0%, rgba(79, 70, 229, 0.08) 0%, rgba(241, 245, 249, 0.95) 65%, #e2e8f0 100%);
        }

        /* Tabular numbers to prevent jitter during live ticking */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Progress Bar Animation */
        @keyframes progressFill {
            from { width: 0%; }
            to { width: 100%; }
        }

        .progress-animating {
            animation: progressFill 5s linear forwards;
        }

        /* Compact 480x320 screen adjustments */
        @media (max-height: 360px) {
            .compact-pad {
                padding: 0.65rem 1rem !important;
            }
            .compact-clock-time {
                font-size: 4.25rem !important;
                line-height: 1 !important;
            }
            .compact-clock-sec {
                font-size: 1.75rem !important;
            }
            .compact-clock-date {
                font-size: 1rem !important;
                margin-top: 0.35rem !important;
            }
        }
    </style>
</head>
<body class="ambient-bg text-slate-900">

    <!-- Top Floating Controls (Pause/Play & Slide Indicators) -->
    <header class="fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-3 py-2 sm:px-6 sm:py-4 pointer-events-none">
        <!-- Slide Dots -->
        <div class="flex items-center space-x-2 bg-white/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-200 pointer-events-auto shadow-sm">
            <button onclick="goToSlide(0)" id="dot-0" aria-label="Clock Slide" class="w-2.5 h-2.5 rounded-full bg-indigo-600 transition-all duration-300"></button>
            <button onclick="goToSlide(1)" id="dot-1" aria-label="Countdowns Slide" class="w-2 h-2 rounded-full bg-slate-300 hover:bg-slate-400 transition-all duration-300"></button>
            <button onclick="goToSlide(2)" id="dot-2" aria-label="Weather Slide" class="w-2 h-2 rounded-full bg-slate-300 hover:bg-slate-400 transition-all duration-300"></button>
        </div>

        <!-- Auto-Scroll Pause / Resume Toggle Button -->
        <button id="toggle-autoplay" onclick="toggleAutoPlay()" class="pointer-events-auto flex items-center space-x-1.5 bg-white/80 hover:bg-white active:scale-95 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-200 text-xs font-medium text-slate-700 transition shadow-sm">
            <span id="autoplay-icon">
                <!-- Pause Icon -->
                <svg class="w-3.5 h-3.5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
            </span>
            <span id="autoplay-label">Auto 5s</span>
        </button>
    </header>

    <!-- Main Horizontal Carousel Track -->
    <main id="carousel-track">

        <!-- =========================================================
             SLIDE 1: DIGITAL CLOCK VIEW
             ========================================================= -->
        <section class="slide" data-index="0">
            <div class="w-full max-w-3xl flex flex-col items-center justify-center text-center">
                <!-- Subtle Top Pill -->
                <div class="mb-2 sm:mb-4 px-3 py-0.5 rounded-full bg-indigo-50 border border-indigo-200 text-indigo-600 text-[11px] sm:text-xs font-semibold tracking-widest uppercase">
                    Local Time • Sammamish, WA
                </div>

                <!-- Main Time Display -->
                <div class="flex items-baseline justify-center font-extrabold tracking-tight tabular-nums text-slate-900 drop-shadow-sm">
                    <span id="clock-hm" class="text-7xl sm:text-8xl md:text-9xl compact-clock-time">12:00</span>
                    <div class="flex flex-col items-start ml-2 sm:ml-3">
                        <span id="clock-ampm" class="text-sm sm:text-xl md:text-2xl font-bold text-indigo-600 uppercase tracking-wider leading-none mb-0.5 sm:mb-1">PM</span>
                        <span id="clock-sec" class="text-2xl sm:text-4xl md:text-5xl font-semibold text-slate-500 compact-clock-sec leading-none">00</span>
                    </div>
                </div>

                <!-- Full Date Display -->
                <p id="clock-date" class="mt-3 sm:mt-6 text-base sm:text-2xl md:text-3xl font-medium text-slate-600 tracking-wide compact-clock-date">
                    Loading Date...
                </p>
            </div>
        </section>

        <!-- =========================================================
             SLIDE 2: COUNTDOWNS VIEW (Bobby's home.html Style)
             ========================================================= -->
        <section class="slide" data-index="1">
            <div class="w-full max-w-3xl bg-white shadow-xl rounded-2xl p-5 sm:p-12 text-center border border-slate-200">
                <h3 class="text-2xl sm:text-4xl font-bold text-slate-900 mb-4 sm:mb-6">Countdowns</h3>
                
                <div class="space-y-3 sm:space-y-6 text-base sm:text-xl text-slate-700">
                    <p class="countdown-item">
                        To New Year's Day: <span id="new-year-countdown" class="font-extrabold text-indigo-600 transition-all duration-300">--</span>
                    </p>
                    
                    <p class="countdown-item">
                        To Thanksgiving &amp; Black Friday: <span id="thxg-countdown" class="font-bold text-indigo-600">--</span> days
                    </p>
                    
                    <p class="countdown-item">
                        To Christmas: <span id="christmas-countdown" class="font-bold text-indigo-600">--</span> days
                    </p>

                    <p class="countdown-item">
                        Since June 19th, 2025: <span id="june-countup" class="font-bold text-indigo-600">--</span> days
                    </p>
                </div>
            </div>
        </section>

        <!-- =========================================================
             SLIDE 3: 5-DAY GOOGLE WEATHER GUI VIEW (Light Theme)
             ========================================================= -->
        <section class="slide" data-index="2">
            <div class="w-full max-w-2xl bg-gradient-to-br from-white via-slate-50 to-indigo-50/40 rounded-2xl border border-slate-200 p-3.5 sm:p-6 shadow-xl flex flex-col justify-between">
                
                <!-- Top Current Weather Header -->
                <div class="flex items-center justify-between mb-2.5 sm:mb-5">
                    <div class="flex items-center space-x-3 sm:space-x-4">
                        <div id="weather-current-icon" class="w-12 h-12 sm:w-16 sm:h-16 flex-shrink-0">
                            <!-- Injected via JS -->
                        </div>
                        <div>
                            <div class="flex items-start">
                                <span id="weather-current-temp" class="text-4xl sm:text-6xl font-bold tracking-tight text-slate-900 tabular-nums">--</span>
                                <span class="text-lg sm:text-2xl font-medium text-slate-500 mt-0.5">°F</span>
                            </div>
                            <p id="weather-current-desc" class="text-xs sm:text-base font-medium text-indigo-600">Loading forecast...</p>
                        </div>
                    </div>

                    <!-- Right Side Location & High/Low Pills -->
                    <div class="text-right flex flex-col items-end">
                        <div class="flex items-center space-x-1 text-xs sm:text-sm font-semibold text-slate-800">
                            <svg class="w-3.5 h-3.5 text-indigo-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                            </svg>
                            <span>Sammamish, WA</span>
                        </div>
                        <p id="weather-today-hl" class="text-[11px] sm:text-sm text-slate-600 font-medium mt-0.5 tabular-nums">
                            H: --° • L: --°
                        </p>
                        <div class="flex items-center space-x-1.5 mt-1">
                            <span id="weather-precip-badge" class="px-2 py-0.5 rounded-full bg-sky-50 border border-sky-200 text-[10px] sm:text-xs text-sky-700 font-medium tabular-nums">
                                💧 --%
                            </span>
                            <span id="weather-wind-badge" class="px-2 py-0.5 rounded-full bg-slate-100 border border-slate-200 text-[10px] sm:text-xs text-slate-700 font-medium tabular-nums">
                                💨 -- mph
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 5-Day Forecast Horizontal Cards -->
                <div id="weather-forecast-grid" class="grid grid-cols-5 gap-1.5 sm:gap-3 pt-2 sm:pt-4 border-t border-slate-200">
                    <!-- 5 Day Cards injected dynamically via JS -->
                </div>

            </div>
        </section>

    </main>

    <!-- Bottom 5-Second Auto-Scroll Progress Indicator -->
    <div class="fixed bottom-0 left-0 right-0 h-1 bg-slate-200 z-40">
        <div id="slide-progress-bar" class="h-full bg-gradient-to-r from-indigo-500 via-sky-400 to-indigo-600 w-0"></div>
    </div>

    <script>
        /* =========================================================
           1. CAROUSEL & AUTO-SCROLL LOGIC (5 SECONDS)
           ========================================================= */
        const track = document.getElementById('carousel-track');
        const progressBar = document.getElementById('slide-progress-bar');
        const totalSlides = 3;
        let currentSlide = 0;
        let isAutoPlaying = true;
        let autoScrollTimer = null;
        const SLIDE_INTERVAL_MS = 5000;

        function updateIndicators(index) {
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (!dot) continue;
                if (i === index) {
                    dot.className = 'w-5 h-2 rounded-full bg-indigo-600 transition-all duration-300';
                } else {
                    dot.className = 'w-2 h-2 rounded-full bg-slate-300 hover:bg-slate-400 transition-all duration-300';
                }
            }
        }

        function resetProgressBar() {
            progressBar.classList.remove('progress-animating');
            void progressBar.offsetWidth;
            if (isAutoPlaying) {
                progressBar.classList.add('progress-animating');
            } else {
                progressBar.style.width = '0%';
            }
        }

        function goToSlide(index) {
            currentSlide = (index + totalSlides) % totalSlides;
            const targetX = currentSlide * window.innerWidth;
            track.scrollTo({
                left: targetX,
                behavior: 'smooth'
            });
            updateIndicators(currentSlide);
            restartAutoScrollTimer();
        }

        function nextSlide() {
            goToSlide(currentSlide + 1);
        }

        function restartAutoScrollTimer() {
            clearInterval(autoScrollTimer);
            resetProgressBar();
            if (isAutoPlaying) {
                autoScrollTimer = setInterval(nextSlide, SLIDE_INTERVAL_MS);
            }
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            const label = document.getElementById('autoplay-label');
            const icon = document.getElementById('autoplay-icon');

            if (isAutoPlaying) {
                label.textContent = 'Auto 5s';
                icon.innerHTML = `<svg class="w-3.5 h-3.5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;
                restartAutoScrollTimer();
            } else {
                label.textContent = 'Paused';
                icon.innerHTML = `<svg class="w-3.5 h-3.5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>`;
                clearInterval(autoScrollTimer);
                progressBar.classList.remove('progress-animating');
                progressBar.style.width = '0%';
            }
        }

        let scrollTimeout;
        track.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const newIndex = Math.round(track.scrollLeft / window.innerWidth);
                if (newIndex !== currentSlide && newIndex >= 0 && newIndex < totalSlides) {
                    currentSlide = newIndex;
                    updateIndicators(currentSlide);
                    restartAutoScrollTimer();
                }
            }, 80);
        });

        window.addEventListener('resize', () => {
            track.scrollTo({
                left: currentSlide * window.innerWidth,
                behavior: 'auto'
            });
        });


        /* =========================================================
           2. LIVE DIGITAL CLOCK LOGIC
           ========================================================= */
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock-hm').textContent = `${hoursStr}:${minutes}`;
            document.getElementById('clock-ampm').textContent = ampm;
            document.getElementById('clock-sec').textContent = seconds;

            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', dateOptions);
        }


        /* =========================================================
           3. COUNTDOWNS LOGIC
           ========================================================= */
        function updateCountdowns() {
            const now = new Date();
            const MS_PER_SECOND = 1000;
            const MS_PER_MINUTE = MS_PER_SECOND * 60;
            const MS_PER_HOUR = MS_PER_MINUTE * 60;
            const MS_PER_DAY = MS_PER_HOUR * 24;

            function getDaysUntil(month, day) {
                const currentYear = now.getFullYear();
                let targetDate = new Date(currentYear, month - 1, day);
                if (now.getTime() > targetDate.getTime() + MS_PER_DAY) {
                    targetDate = new Date(currentYear + 1, month - 1, day);
                }
                const diff = targetDate.getTime() - now.getTime();
                return Math.ceil(diff / MS_PER_DAY);
            }

            const newYearCountdownEl = document.getElementById('new-year-countdown');
            if (newYearCountdownEl) {
                const currentYear = now.getFullYear();
                let nextNewYear = new Date(`${currentYear + 1}-01-01T00:00:00`);
                let timeDifference = nextNewYear.getTime() - now.getTime();

                if (timeDifference < 0) {
                    newYearCountdownEl.textContent = "Happy New Year!";
                    nextNewYear = new Date(`${currentYear + 2}-01-01T00:00:00`);
                    timeDifference = nextNewYear.getTime() - now.getTime();
                }

                const tenMinutesInMs = 10 * 60 * 1000;
                const oneMinuteInMs = 1 * 60 * 1000;

                const days = Math.floor(timeDifference / MS_PER_DAY);
                let remaining = timeDifference % MS_PER_DAY;
                const hours = Math.floor(remaining / MS_PER_HOUR);
                remaining %= MS_PER_HOUR;
                const minutes = Math.floor(remaining / MS_PER_MINUTE);
                remaining %= MS_PER_MINUTE;
                const seconds = Math.floor(remaining / MS_PER_SECOND);
                const pad = (num) => String(num).padStart(2, '0');

                newYearCountdownEl.classList.remove('text-amber-600', 'text-red-600', 'text-4xl', 'text-5xl');

                if (timeDifference < tenMinutesInMs) {
                    if (timeDifference < oneMinuteInMs) {
                        newYearCountdownEl.textContent = `${seconds}`;
                        newYearCountdownEl.classList.add('text-red-600', 'text-5xl');
                    } else {
                        newYearCountdownEl.textContent = `${pad(minutes)}:${pad(seconds)}`;
                        newYearCountdownEl.classList.add('text-amber-600', 'text-4xl');
                    }
                } else if (days >= 0) {
                    newYearCountdownEl.textContent = `${days}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
                }
            }

            const thxgEl = document.getElementById('thxg-countdown');
            if (thxgEl) thxgEl.textContent = getDaysUntil(11, 26);

            const christmasEl = document.getElementById('christmas-countdown');
            if (christmasEl) christmasEl.textContent = getDaysUntil(12, 25);

            const june19th2025 = new Date('2025-06-19T00:00:00');
            const diffSinceJune = now.getTime() - june19th2025.getTime();
            const daysSinceJune = Math.floor(diffSinceJune / MS_PER_DAY);
            const juneEl = document.getElementById('june-countup');
            if (juneEl) {
                juneEl.textContent = daysSinceJune > 0 ? daysSinceJune : 0;
            }
        }


        /* =========================================================
           4. 5-DAY GOOGLE WEATHER GUI
           ========================================================= */
        function getWeatherSvg(code) {
            if (code === 0) {
                return `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-sm">
                    <circle cx="32" cy="32" r="14" fill="#EAB308"/>
                    <g stroke="#EAB308" stroke-width="4" stroke-linecap="round">
                        <line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/>
                        <line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/>
                        <line x1="13.6" y1="13.6" x2="17.9" y2="17.9"/><line x1="46.1" y1="46.1" x2="50.4" y2="50.4"/>
                        <line x1="13.6" y1="50.4" x2="17.9" y2="46.1"/><line x1="46.1" y1="17.9" x2="50.4" y2="13.6"/>
                    </g>
                </svg>`;
            }
            if (code === 1 || code === 2) {
                return `<svg viewBox="0 0 64 64" class="w-full h-full">
                    <circle cx="24" cy="24" r="11" fill="#EAB308"/>
                    <path d="M22 46h24a10 10 0 0 0 1.5-19.9A14 14 0 0 0 20.5 23 11 11 0 0 0 22 46z" fill="#94A3B8"/>
                </svg>`;
            }
            if (code === 3 || code === 45 || code === 48) {
                return `<svg viewBox="0 0 64 64" class="w-full h-full">
                    <path d="M18 46h28a11 11 0 0 0 1.6-21.9A15 15 0 0 0 18.8 21 12 12 0 0 0 18 46z" fill="#64748B"/>
                    <path d="M14 50h26a9 9 0 0 0 1.2-17.9A12 12 0 0 0 17.5 30 10 10 0 0 0 14 50z" fill="#94A3B8"/>
                </svg>`;
            }
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
                return `<svg viewBox="0 0 64 64" class="w-full h-full">
                    <path d="M18 40h28a10 10 0 0 0 1.5-19.9A14 14 0 0 0 20.5 17 11 11 0 0 0 18 40z" fill="#94A3B8"/>
                    <circle cx="22" cy="48" r="2.5" fill="#0284C7"/>
                    <circle cx="32" cy="52" r="2.5" fill="#0284C7"/>
                    <circle cx="42" cy="48" r="2.5" fill="#0284C7"/>
                </svg>`;
            }
            if (code >= 95) {
                return `<svg viewBox="0 0 64 64" class="w-full h-full">
                    <path d="M18 38h28a10 10 0 0 0 1.5-19.9A14 14 0 0 0 20.5 15 11 11 0 0 0 18 38z" fill="#475569"/>
                    <polygon points="33,36 25,48 31,48 28,58 40,44 33,44" fill="#EAB308"/>
                </svg>`;
            }
            return `<svg viewBox="0 0 64 64" class="w-full h-full">
                <path d="M18 38h28a10 10 0 0 0 1.5-19.9A14 14 0 0 0 20.5 15 11 11 0 0 0 18 38z" fill="#64748B"/>
                <g stroke="#0284C7" stroke-width="3" stroke-linecap="round">
                    <line x1="23" y1="44" x2="20" y2="52"/>
                    <line x1="33" y1="44" x2="30" y2="52"/>
                    <line x1="43" y1="44" x2="40" y2="52"/>
                </g>
            </svg>`;
        }

        function getWeatherLabel(code) {
            const labels = {
                0: 'Clear Sky',
                1: 'Mainly Clear',
                2: 'Partly Cloudy',
                3: 'Overcast',
                45: 'Foggy',
                51: 'Light Drizzle',
                61: 'Light Rain',
                63: 'Rain',
                65: 'Heavy Rain',
                71: 'Light Snow',
                80: 'Showers',
                95: 'Thunderstorm'
            };
            return labels[code] || 'Cloudy & Showers';
        }

        function renderWeatherUI(data) {
            const current = data.current;
            const daily = data.daily;

            document.getElementById('weather-current-temp').textContent = Math.round(current.temperature_2m);
            document.getElementById('weather-current-desc').textContent = getWeatherLabel(current.weather_code);
            document.getElementById('weather-current-icon').innerHTML = getWeatherSvg(current.weather_code);

            const todayMax = Math.round(daily.temperature_2m_max[0]);
            const todayMin = Math.round(daily.temperature_2m_min[0]);
            const todayPrecip = daily.precipitation_probability_max[0] ?? 0;

            document.getElementById('weather-today-hl').textContent = `H: ${todayMax}° • L: ${todayMin}°`;
            document.getElementById('weather-precip-badge').textContent = `💧 ${todayPrecip}%`;
            document.getElementById('weather-wind-badge').textContent = `💨 ${Math.round(current.wind_speed_10m)} mph`;

            const grid = document.getElementById('weather-forecast-grid');
            grid.innerHTML = '';

            const highs = daily.temperature_2m_max.slice(0, 5);
            const lows = daily.temperature_2m_min.slice(0, 5);
            const weekMax = Math.max(...highs);
            const weekMin = Math.min(...lows);
            const tempSpan = Math.max(weekMax - weekMin, 1);

            for (let i = 0; i < 5; i++) {
                const dateObj = new Date(daily.time[i] + 'T12:00:00');
                const dayName = i === 0 ? 'Today' : dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                const code = daily.weather_code[i];
                const hi = Math.round(highs[i]);
                const lo = Math.round(lows[i]);
                const pop = daily.precipitation_probability_max[i] ?? 0;

                const leftPct = Math.round(((lo - weekMin) / tempSpan) * 100);
                const widthPct = Math.max(Math.round(((hi - lo) / tempSpan) * 100), 18);

                const card = document.createElement('div');
                card.className = `flex flex-col items-center justify-between rounded-xl p-1.5 sm:p-3 border transition ${
                    i === 0 
                    ? 'bg-indigo-50 border-indigo-200' 
                    : 'bg-white border-slate-200 shadow-sm'
                }`;

                card.innerHTML = `
                    <span class="text-[11px] sm:text-sm font-semibold ${i === 0 ? 'text-indigo-600' : 'text-slate-700'}">${dayName}</span>
                    <div class="w-7 h-7 sm:w-10 sm:h-10 my-1 sm:my-2">${getWeatherSvg(code)}</div>
                    <span class="text-[10px] sm:text-xs font-medium text-sky-600 h-3.5 tabular-nums">${pop > 10 ? pop + '%' : ''}</span>
                    <div class="w-full mt-1 sm:mt-2 flex flex-col items-center">
                        <div class="w-full flex justify-between text-[10px] sm:text-xs font-bold tabular-nums px-0.5 mb-1">
                            <span class="text-slate-500">${lo}°</span>
                            <span class="text-slate-900">${hi}°</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden relative">
                            <div class="h-full rounded-full bg-gradient-to-r from-sky-500 to-amber-500 absolute" style="left: ${leftPct}%; width: ${widthPct}%;"></div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        async function fetchWeather() {
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=47.6163&longitude=-122.0356&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=5';
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Weather fetch failed');
                const data = await res.json();
                renderWeatherUI(data);
            } catch (err) {
                const today = new Date();
                const fallbackDates = Array.from({ length: 5 }, (_, idx) => {
                    const d = new Date(today);
                    d.setDate(today.getDate() + idx);
                    return d.toISOString().split('T')[0];
                });
                renderWeatherUI({
                    current: { temperature_2m: 48, weather_code: 2, wind_speed_10m: 6 },
                    daily: {
                        time: fallbackDates,
                        weather_code: [2, 61, 3, 1, 61],
                        temperature_2m_max: [51, 49, 47, 52, 48],
                        temperature_2m_min: [39, 41, 37, 36, 40],
                        precipitation_probability_max: [20, 75, 30, 10, 65]
                    }
                });
            }
        }


        /* =========================================================
           5. INITIALIZATION
           ========================================================= */
        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            updateCountdowns();
            fetchWeather();

            setInterval(() => {
                updateClock();
                updateCountdowns();
            }, 1000);

            setInterval(fetchWeather, 15 * 60 * 1000);

            restartAutoScrollTimer();
        });
    </script>
</body>
</html>
